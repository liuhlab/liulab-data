site_name: liulab-data
site_description: Data curation, download, and organization utilities for the Liu Lab.
site_url: https://lhqing.github.io/liulab-data/
repo_url: https://github.com/lhqing/liulab-data
repo_name: lhqing/liulab-data
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            heading_level: 2
            # ``download`` is shared via the private _SraDownloadMixin (in
            # labdata.geo.sratools); render it on the Series/BioProject reference
            # pages that inherit it.
            inherited_members: [download]

nav:
  - Home: index.md
  - Tutorials:
      - Understanding GEO & SRA: tutorials/understanding-geo.md
      - GEO Series: tutorials/geo-series.md
      - 10x cellranger BAM → FASTQ: tutorials/tenx-bam.md
  - API reference: reference.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

watch:
  - src/labdata

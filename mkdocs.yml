# The docs site. Built by zensical (`pixi run docs-build`), which reads this file directly,
# so the config stays portable back to mkdocs.
#
# zensical silently ignores `exclude_docs:`: every file under docs/ is published. Keep the
# `nav:` explicit; a page meant for agents also needs `search: exclude: true` front matter.
site_name: liulab-data
site_description: Data curation, download, and organization utilities for the Liu Lab.
site_url: https://liuhlab.github.io/liulab-data/
repo_url: https://github.com/liuhlab/liulab-data
repo_name: liuhlab/liulab-data
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            heading_level: 2
            # ``download`` is shared via the private _SraDownloadMixin (in
            # labdata.geo.sratools); render it on the Series/BioProject reference
            # pages that inherit it.
            inherited_members: [download]

# A nav entry naming a missing file builds green under zensical, even with `--strict`;
# conformance rule `nav-target-exists` catches it instead.
nav:
  - Home: index.md
  - Tutorials:
      - Understanding GEO & SRA: tutorials/understanding-geo.md
      - GEO Series: tutorials/geo-series.md
      - 10x cellranger BAM → FASTQ: tutorials/tenx-bam.md
  - How-to:
      - Copy the store to GCS: how-to/store-gcs.md
  - API reference: reference.md

# `--strict` misses an absolute link (`/gone/`) and a link with no `.md` extension; check
# those by hand. The keys below are zensical's own and mkdocs rejects them.
# `unresolved_references:` is left off: it reads any bracketed word in prose as a broken link.
validation:
  links:
    not_found: warn
    anchors: warn
  unresolved_footnotes: true
  unused_definitions: true
  unused_footnotes: true
  shadowed_definitions: true
  shadowed_footnotes: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

watch:
  - src/labdata

# Google Analytics 4 — shared Liu Lab org property. The same tag is used
# across every liuhlab GitHub Pages site so traffic lands in one GA4
# property, separated by page path. gtag.js is GFW-blocked, so
# mainland-China readers are counted host-side (Tencent Cloud) instead.
extra:
  analytics:
    provider: google
    property: G-6M1CJF9WXY

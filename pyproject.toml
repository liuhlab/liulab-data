[project]
name = "liulab-data"
description = "Data curation, download, and organization utilities for the Liu Lab."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Liu Lab" }]
keywords = ["bioinformatics", "data-curation", "geo", "ncbi", "entrez"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "biopython>=1.83",
    "pandas>=2.0",
    "typer>=0.12",
    "snakemake>=8",   # orchestrates the download DAG (labdata.geo.pipeline)
    "duckdb>=1.5.6,<2",
    "pyarrow>=25.0.0,<26",
]

[project.urls]
Homepage = "https://github.com/liuhlab/liulab-data"
Issues = "https://github.com/liuhlab/liulab-data/issues"
Changelog = "https://github.com/liuhlab/liulab-data/blob/main/CHANGELOG.md"

[project.scripts]
labdata = "labdata.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/labdata"]

# The Snakemake workflows are data files, not Python modules — force them into the
# wheel so labdata.{geo,tenx}.pipeline can locate them at runtime via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"src/labdata/geo/pipeline.smk" = "labdata/geo/pipeline.smk"
"src/labdata/tenx/pipeline.smk" = "labdata/tenx/pipeline.smk"

# -------- pixi --------

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

# Editable install of this package into every env
[tool.pixi.pypi-dependencies]
liulab-data = { path = ".", editable = true }

# Runtime deps (conda-forge + bioconda).
# sra-tools (prefetch/fasterq-dump), pigz, and curl (the original-format download
# path) are external binaries used by labdata.geo.sratools; 10x_bamtofastq is 10x
# Genomics' cellranger-BAM → FASTQ tool (it installs a `bamtofastq` binary) used by
# labdata.tenx.bamtofastq. They are not importable Python, so they live here only, not
# in [project.dependencies].
# snakemake-minimal is the lightweight conda build of Snakemake (no reporting/
# remote-provider extras); it orchestrates the download and tenx DAGs.
[tool.pixi.dependencies]
biopython = ">=1.83"
pandas = ">=2.0"
typer = ">=0.12"
sra-tools = "*"
pigz = "*"
curl = "*"
"10x_bamtofastq" = "*"
snakemake-minimal = ">=8"
# For conformance, which parses mkdocs.yml and the workflows.
pyyaml = "*"
duckdb = ">=1.5.6,<2"
pyarrow = ">=25.0.0,<26"

# The interpreter. `requires-python` is the floor; ruff and pyright take their target from it.
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

# Test feature
[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

# Dev tooling feature
[tool.pixi.feature.dev.dependencies]
ruff = "*"
# Exact: Pylance is pyright, so the editor and CI must give one verdict.
pyright = "==1.1.411"
python-build = "*"
hatch-vcs = "*"
ipykernel = "*"   # lets the pixi env back a Jupyter kernel (notebook dev)
# Exact: the jargon map and the grade-11 number were measured against this version.
vale = "3.19.0.*"
markdownlint-cli2 = "*"

# Docs feature. zensical reads mkdocs.yml as is. Exact pin: at 0.0.x nothing promises the
# next patch is compatible, so bump it in a commit of its own and re-run `docs-build`.
[tool.pixi.feature.docs.dependencies]
zensical = "==0.0.57"
mkdocstrings-python = ">=2.0.7,<3"
ruff = "*"   # used by mkdocstrings to format rendered signatures

# On the feature, so these resolve in the `docs` environment with no `-e` flag.
# `serve` ignores `--strict`, hence its absence.
[tool.pixi.feature.docs.tasks]
docs = "zensical serve"
docs-build = "zensical build --clean --strict"

[tool.pixi.environments]
default = { features = ["py313", "dev", "test"], solve-group = "default" }
test    = { features = ["py313", "test"], solve-group = "default" }
docs    = { features = ["py313", "docs"], solve-group = "default" }

[tool.pixi.tasks]
lint      = "ruff check ."
fmt       = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "pyright"
test      = "pytest"
test-cov  = "pytest --cov=labdata --cov-report=term-missing"
# `.`, never an absolute path: an absolute path matches no `.vale.ini` section and exits 0.
# The globs stop vale walking trees it never lints — check.sh runs steps concurrently, and a
# walk of .pixi/ races pytest writing __pycache__ there.
vale = "vale --glob='!{.pixi,site,dist,build}/**' ."
markdownlint = "markdownlint-cli2"
conformance = "python scripts/conformance.py"
# The static step list lives here and nowhere else; `check.sh` takes it as arguments.
check-static = "bash scripts/check.sh lint fmt-check typecheck vale markdownlint conformance"
check     = { depends-on = ["check-static", "test"] }
build     = "python -m build"
# Register THIS env's Python as a Jupyter kernel (idempotent). Run once so a
# standalone Jupyter Lab can pick the "Python (liulab-data)" kernel and import
# labdata. Re-run after recreating the env (the kernelspec path changes).
register-kernel = "python -m ipykernel install --user --name liulab-data --display-name \"Python (liulab-data dev)\""

# -------- tool config --------

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# No `target-version`: ruff infers it from `requires-python`.
extend-exclude = [".pixi", "site", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "N",    # pep8-naming
    "D",    # pydocstyle (numpy convention configured below)
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles it
    "D203",  # one-blank-line-before-class (incompatible with D211)
    "D213",  # multi-line-summary-second-line (incompatible with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-bugbear]
# Typer uses call expressions (Option/Argument) as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",     # tests don't need full docstrings
    "S101",  # asserts are the whole point
]
"**/__init__.py" = [
    "D104",  # docstring on package init is optional
]

[tool.pyright]
# `scripts` included: CI and conformance execute those files.
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.pixi"]
venvPath = ".pixi/envs"
venv = "default"
# No `pythonVersion`: taken from the interpreter in the environment above.
typeCheckingMode = "standard"
# Not redundant: `standard` does not check that a parameter is annotated at all. `Any`
# satisfies it, so the fix is always in the file you are editing. Scoped off `tests/` below.
reportMissingParameterType = "error"
# Deliberately NOT `reportUnknownParameterType`: it also fails annotated parameters and
# inferred return types whose types an untyped dependency owns. Not a bar a lab repo can meet.
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

# `tests/` back to plain `standard`. A fixture's type is pytest's, not the author's, and a
# test signature promises a caller nothing. `src` keeps it.
[[tool.pyright.executionEnvironments]]
root = "tests"
# The tests import their helpers as the `tests` package, so resolve from the repo root.
extraPaths = ["."]
reportMissingParameterType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "network: hits live NCBI services (E-utilities, SDL) (deselected by default; run with `-m network`)",
]

[tool.coverage.run]
branch = true
source = ["src/labdata"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]

# -------- liulab --------
# Read by `scripts/conformance.py`; its docstring has the rules.

# The declared agent-facing set. Keys are path prefixes matched against `git ls-files`, not
# globs; a trailing `/` matches a directory. Values name the Vale Length rule, or `false`.
[tool.liulab.agent-docs]
"AGENTS.md" = "LengthDoc"
"GLOSSARY.md" = false         # capped per entry by conformance, not per file
"docs/agents/" = "LengthDoc"
"skills/" = "LengthDoc"
"docs/adr/" = "LengthAdr"
"docs/research/" = false

# Keyed by rule name, value the reason. Per-rule, never per-file; no expiry; printed on every
# run. `placeholder-rename` refuses to be waived.
[tool.liulab.waived]

name: Release

on:
  # Publishing a GitHub Release is the deliberate act that publishes to PyPI. Never a tag
  # push: pushing `v0.0.0` (or any tag) must not fire a publish.
  release:
    types: [published]
  # Re-run a release whose publish failed for a reason outside the code.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs reads the tag from history
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
          locked: true
      - name: pixi run build
        run: pixi run -e default build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/liulab-data
    permissions:
      contents: read
      id-token: write   # required for PyPI OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

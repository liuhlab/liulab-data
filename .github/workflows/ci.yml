name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ruff, pyright and conformance, all at once, all reported.
  check:
    runs-on: ubuntu-latest
    steps:
      # A real checkout, not a source archive: `conformance` shells out to `git ls-files`.
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
          locked: true
      # `check-static`, not `check`: pytest is the `test` job below, in its own environment.
      - run: pixi run check-static

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: test
          locked: true
      - name: pytest
        run: pixi run -e test test

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs needs full history to derive a version
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
          locked: true
      - name: pixi run build
        run: pixi run -e default build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docs:
    name: docs build (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: docs
          locked: true
      # `docs-build` is a task on the `docs` feature, so no `-e` flag is needed. It carries
      # `--strict`, which catches dead links but not a `nav:` entry naming a missing file
      # (conformance does that). Publishing is `docs.yml`, on `main`.
      - name: docs-build
        run: pixi run docs-build

name: CI

# One job: GitHub bills each job rounded up to a whole minute. Every step after the first runs
# even when one before it failed, so a run reports every failure.

on:
  # Tests the merge commit. A push to `main` would test again what the pull request tested.
  # A draft runs nothing (the job's `if:`); marking it ready runs CI once.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Checks `main` by hand.
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; a run started by hand is never
# cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Skipped on a draft, which bills nothing. A run by hand has no pull request, so it runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # A real checkout, not a source archive: `conformance` shells out to `git ls-files`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # `build` needs the tags: hatch-vcs reads the newest one
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # `docs` holds the site builder, which `default` does not.
          environments: default docs
          locked: true
      # Two steps, not `check`, so each has its own verdict on the run page.
      - run: pixi run check-static
      - run: pixi run test
        if: ${{ !cancelled() }}
      - run: pixi run build
        id: build
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        # Only a wheel that was built: a failed build would fail this step too.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # `docs-build` carries `--strict`. Publishing is `docs.yml`, on `main`.
      - run: pixi run docs-build
        if: ${{ !cancelled() }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          locked: true
      - name: ruff (lint)
        run: pixi run -e default lint
      - name: ruff format check
        run: pixi run -e default fmt-check
      - name: pyright
        run: pixi run -e default typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test
          locked: true
      - name: pytest
        run: pixi run -e test test

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # hatch-vcs needs full history to derive a version
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          locked: true
      - name: pixi run build
        run: pixi run -e default build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docs:
    name: docs build (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          locked: true
      - name: mkdocs build --strict
        run: pixi run -e docs mkdocs build --strict

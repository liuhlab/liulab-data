name: Docs

# Builds the site with zensical and publishes `./site` to the `gh-pages` branch on every
# push to main. zensical has no `gh-deploy`, so the publish is a separate action.
#
# Setup (one-off, by a maintainer):
#   1. Let this workflow run once so it creates the `gh-pages` branch.
#   2. Settings → Pages → Build and deployment → Source: "Deploy from a branch".
#   3. Branch: `gh-pages`, folder: `/ (root)`. Save.
#   4. The published URL appears at Settings → Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy force-pushes the gh-pages branch. Nothing else here writes.
permissions:
  contents: write

# Allow only one concurrent deployment; don't cancel an in-progress one
# (a run killed between build and push could leave gh-pages half-written).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the env installs labdata editable; hatch-vcs needs history
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: docs
          locked: true
      # Writes `./site`. `--clean --strict` live in the task, so CI and a laptop build alike.
      - run: pixi run docs-build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # One commit, replaced whole each deploy, as `mkdocs gh-deploy --force` did.
          force_orphan: true

name: Docs

# Builds the MkDocs site and pushes it to the `gh-pages` branch on every push
# to main, via `mkdocs gh-deploy`.
#
# Setup (one-off, by a maintainer):
#   1. Let this workflow run once so it creates the `gh-pages` branch.
#   2. Settings → Pages → Build and deployment → Source: "Deploy from a branch".
#   3. Branch: `gh-pages`, folder: `/ (root)`. Save.
#   4. The published URL appears at Settings → Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-deploy commits and pushes the built site to the gh-pages branch.
permissions:
  contents: write

# Allow only one concurrent deployment; don't cancel an in-progress one
# (a push mid-flight could leave gh-pages in a partial state).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # mkdocs revision dates / hatch-vcs version need history
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          locked: true
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: mkdocs gh-deploy
        run: pixi run -e docs mkdocs gh-deploy --force --strict

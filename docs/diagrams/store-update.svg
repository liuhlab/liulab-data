<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="store-update-title">
  <title id="store-update-title">The update workflow. A refresh downloads snapshots and patches the GEO Series list; both runs pick the target Series, fetch them in the GEO and SRA lanes and pack the parts into raw/. A refresh also lists the changes and confirms withdrawn Series. Every update ends with extract, build, switch, prune and copy to GCS.</title>
  <defs>
    <marker id="store-update-ah-store" class="d-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="store-update-ah-gcs" class="d-gcs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect class="d-band" x="22" y="0" width="638" height="118" rx="6"/>
  <rect class="d-band" x="22" y="136" width="638" height="118" rx="6"/>
  <rect class="d-band" x="22" y="272" width="638" height="86" rx="6"/>
  <text class="d-head" x="28" y="14">WHAT TO FETCH</text>
  <text class="d-head" x="28" y="150">FETCH AND PACK</text>
  <text class="d-head" x="28" y="286">BUILD AND COPY</text>
  <g class="d-store">
    <!-- What to fetch -->
    <rect class="d-box d-dash" x="28" y="22" width="124" height="40" rx="5"/>
    <text class="d-title" x="36" y="38">Snapshots</text>
    <text class="d-note" x="36" y="54">FTP bulk files</text>
    <rect class="d-box d-dash" x="28" y="70" width="124" height="40" rx="5"/>
    <text class="d-title" x="36" y="86">GEO Series list</text>
    <text class="d-note" x="36" y="102">patch the summaries</text>
    <path class="d-edge" d="M152,42 H168 V90 H152"/>
    <path class="d-edge" d="M168,66 H226" marker-end="url(#store-update-ah-store)"/>
    <text x="197" y="60" text-anchor="middle">snapshots</text>
    <rect class="d-box" x="226" y="46" width="120" height="40" rx="5"/>
    <text class="d-title" x="234" y="62">Targets</text>
    <text class="d-note" x="234" y="78">the Series to hold</text>
    <path class="d-edge" d="M346,66 H396" marker-end="url(#store-update-ah-store)"/>
    <text x="371" y="60" text-anchor="middle">targets</text>
    <rect class="d-box d-dash" x="396" y="46" width="120" height="40" rx="5"/>
    <text class="d-title" x="404" y="62">Changes</text>
    <text class="d-note" x="404" y="78">what to fetch again</text>
    <!-- Fetch and pack -->
    <path class="d-edge" d="M456,86 V128 H16 V226 H28" marker-end="url(#store-update-ah-store)"/>
    <path class="d-edge" d="M16,178 H28" marker-end="url(#store-update-ah-store)"/>
    <text x="462" y="108">Series to fetch</text>
    <rect class="d-box" x="28" y="158" width="124" height="40" rx="5"/>
    <text class="d-title" x="36" y="174">GEO lane</text>
    <text class="d-note" x="36" y="190">SOFT and file lists</text>
    <rect class="d-box" x="28" y="206" width="124" height="40" rx="5"/>
    <text class="d-title" x="36" y="222">SRA lane, pass 1</text>
    <text class="d-note" x="36" y="238">beside the GEO lane</text>
    <path class="d-edge" d="M152,178 H168 V226 H152"/>
    <path class="d-edge" d="M168,202 H210" marker-end="url(#store-update-ah-store)"/>
    <text x="189" y="184" text-anchor="middle">SOFT</text>
    <text x="189" y="196" text-anchor="middle">files</text>
    <rect class="d-box" x="210" y="174" width="120" height="56" rx="5"/>
    <text class="d-title" x="218" y="192">SRA lane, pass 2</text>
    <text class="d-note" x="218" y="208">experiments</text>
    <text class="d-note" x="218" y="222">the SOFT adds</text>
    <path class="d-edge" d="M330,202 H380" marker-end="url(#store-update-ah-store)"/>
    <text x="355" y="184" text-anchor="middle">fetch</text>
    <text x="355" y="196" text-anchor="middle">results</text>
    <rect class="d-box d-dash" x="380" y="174" width="110" height="56" rx="5"/>
    <text class="d-title" x="388" y="196">Confirm</text>
    <text class="d-note" x="388" y="212">withdrawn Series</text>
    <path class="d-edge" d="M490,202 H534" marker-end="url(#store-update-ah-store)"/>
    <text x="512" y="196" text-anchor="middle">parts</text>
    <rect class="d-box" x="534" y="174" width="100" height="56" rx="5"/>
    <text class="d-title" x="542" y="196">Pack</text>
    <text class="d-note" x="542" y="212">parts into raw/</text>
    <!-- Build and copy -->
    <path class="d-edge" d="M584,230 V262 H249 V294" marker-end="url(#store-update-ah-store)"/>
    <text x="590" y="248">raw/</text>
    <path class="d-edge" d="M28,42 H6 V322 H92" marker-end="url(#store-update-ah-store)"/>
    <path class="d-edge" d="M28,90 H6"/>
    <text x="30" y="316">snapshots</text>
    <rect class="d-box" x="92" y="294" width="70" height="56" rx="5"/>
    <text class="d-title" x="100" y="311">Extract</text>
    <text class="d-note" x="100" y="327">snapshots</text>
    <text class="d-note" x="100" y="341">to Parquet</text>
    <path class="d-edge" d="M162,322 H212" marker-end="url(#store-update-ah-store)"/>
    <text x="187" y="316" text-anchor="middle">Parquet</text>
    <rect class="d-tint" x="212" y="294" width="74" height="56" rx="5"/>
    <text class="d-title" x="220" y="311">Build</text>
    <text class="d-note" x="220" y="327">a new build</text>
    <path class="d-edge" d="M286,322 H336" marker-end="url(#store-update-ah-store)"/>
    <text x="311" y="304" text-anchor="middle">new</text>
    <text x="311" y="316" text-anchor="middle">build</text>
    <rect class="d-box" x="336" y="294" width="102" height="56" rx="5"/>
    <text class="d-title" x="344" y="311">Switch</text>
    <text class="d-note" x="344" y="327">check coverage,</text>
    <text class="d-note" x="344" y="341">move the marker</text>
    <path class="d-edge" d="M438,322 H486" marker-end="url(#store-update-ah-store)"/>
    <text x="462" y="316" text-anchor="middle">marker</text>
    <rect class="d-box" x="486" y="294" width="66" height="56" rx="5"/>
    <text class="d-title" x="494" y="311">Prune</text>
    <text class="d-note" x="494" y="327">builds out</text>
    <text class="d-note" x="494" y="341">of use</text>
  </g>
  <g class="d-gcs">
    <path class="d-edge" d="M552,322 H602" marker-end="url(#store-update-ah-gcs)"/>
    <text x="577" y="316" text-anchor="middle">changes</text>
    <rect class="d-tint" x="602" y="294" width="56" height="56" rx="5"/>
    <text class="d-title" x="610" y="311">Copy</text>
    <text class="d-note" x="610" y="327">to GCS</text>
  </g>
</svg>
